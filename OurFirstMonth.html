<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our First Month 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#ffe3ec;--bg2:#ffc2d6;--ink:#5a1230;--soft:#8a3a58;--card:rgba(255,255,255,.65);--accent:#e0245e;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#2a0a1a;--bg2:#4a1230;--ink:#ffe3ec;--soft:#f5a9c4;--card:rgba(255,255,255,.08);--accent:#ff4d85}
}
:root[data-theme="dark"]{--bg1:#2a0a1a;--bg2:#4a1230;--ink:#ffe3ec;--soft:#f5a9c4;--card:rgba(255,255,255,.08);--accent:#ff4d85}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:'Playfair Display',Georgia,serif;overflow-x:hidden;text-align:center}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
section{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:12vh 22px}
h1{font-family:'Dancing Script',cursive,Georgia,serif;font-size:clamp(2.6rem,10vw,4.6rem);margin:0 0 8px;color:var(--accent);line-height:1.1}
h2{font-family:'Dancing Script',cursive,Georgia,serif;font-size:2.2rem;color:var(--accent);margin:0 0 24px}
.sub{font-style:italic;color:var(--soft);font-size:1.15rem}
.beat{font-size:3.2rem;display:inline-block;animation:beat 1.3s infinite;margin-bottom:10px}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.counter{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.counter div{background:var(--card);backdrop-filter:blur(8px);border-radius:16px;padding:14px 16px;min-width:76px;box-shadow:0 6px 24px rgba(224,36,94,.15)}
.counter b{display:block;font-size:1.8rem;color:var(--accent)}
.counter span{font-size:.75rem;color:var(--soft);letter-spacing:.1em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:18px;padding:22px 14px;cursor:pointer;min-height:110px;display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1.4;transition:transform .3s,box-shadow .3s;box-shadow:0 6px 24px rgba(224,36,94,.12);border:0;color:var(--ink);font-family:inherit}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card.open{font-style:italic;color:var(--soft)}
.letter{background:var(--card);backdrop-filter:blur(10px);border-radius:22px;padding:32px 24px;text-align:left;line-height:1.85;font-size:1.08rem;min-height:260px;box-shadow:0 10px 40px rgba(224,36,94,.18)}
.letter .sig{font-family:'Dancing Script',cursive,Georgia,serif;font-size:1.8rem;color:var(--accent);text-align:right;margin-top:14px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.polaroid{background:#fff;padding:10px 10px 14px;border-radius:6px;box-shadow:0 10px 30px rgba(90,18,48,.25);transition:transform .3s;color:#5a1230}
.polaroid:nth-child(odd){transform:rotate(-2.5deg)}
.polaroid:nth-child(even){transform:rotate(2.5deg)}
.polaroid:hover{transform:rotate(0) scale(1.04)}
.polaroid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:3px}
.polaroid p{margin:10px 0 0;font-family:'Dancing Script',cursive,Georgia,serif;font-size:1.25rem}
button.cta{font-family:'Dancing Script',cursive,Georgia,serif;font-size:1.6rem;background:var(--accent);color:#fff;border:0;border-radius:50px;padding:14px 38px;cursor:pointer;box-shadow:0 8px 28px rgba(224,36,94,.4);transition:transform .2s}
button.cta:hover{transform:scale(1.07)}
#final{margin-top:26px;font-size:1.35rem;opacity:0;transition:opacity 1.5s;min-height:80px}
#final.show{opacity:1}
.fade{opacity:0;transform:translateY(30px);transition:all 1s}
.fade.in{opacity:1;transform:none}
</style>
</head>
<body>
<canvas id="hearts"></canvas>

<section id="hero" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center">
  <div class="beat">💗</div>
  <h1>For my Everything</h1>
  <p class="sub">One month of you. One month of the happiest me.</p>
  <div class="counter" id="counter"></div>
</section>

<section class="fade" id="gallerySec">
  <h2>Our moments</h2>
  <div class="gallery" id="gallery"></div>
</section>

<section class="fade">
  <h2>Little things I love about you</h2>
  <p class="sub" style="margin-bottom:22px">Tap each heart 💌</p>
  <div class="grid" id="grid"></div>
</section>

<section class="fade">
  <h2>A letter for you</h2>
  <div class="letter"><span id="typed"></span><span id="cursor">|</span><div class="sig" id="sig"></div></div>
</section>

<section class="fade" style="padding-bottom:20vh">
  <h2>One last thing...</h2>
  <button class="cta" id="btn">Open me ✨</button>
  <div id="final"></div>
</section>

// Photo gallery (section hides itself if there are no photos)
const gal = document.getElementById('gallery');
if(!PHOTOS.length) document.getElementById('gallerySec').remove();
PHOTOS.forEach(p=>{
  const d = document.createElement('div'); d.className='polaroid';
  d.innerHTML = `<img src="${p.src}" alt="${p.caption||''}" loading="lazy"><p>${p.caption||''}</p>`;
  gal.appendChild(d);
});

document.getElementById('sig').textContent = "Forever yours, " + YOUR_NAME;

// Live counter
const start = new Date(START_DATE);
function tick(){
  let d = Math.max(0, Date.now() - start.getTime()) / 1000;
  const days = Math.floor(d/86400), h = Math.floor(d%86400/3600), m = Math.floor(d%3600/60), s = Math.floor(d%60);
  document.getElementById('counter').innerHTML =
    [[days,'Days'],[h,'Hours'],[m,'Minutes'],[s,'Seconds']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
}
tick(); setInterval(tick,1000);

  const b = document.createElement('button');
  b.className='card'; b.textContent='💗';
  b.onclick=()=>{ b.textContent = b.classList.toggle('open') ? r : '💗'; burst(b); };
  grid.appendChild(b);
});

// Scroll fade-in + typewriter
let typed = false;
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){
    e.target.classList.add('in');
    if(e.target.querySelector('.letter') && !typed){ typed = true; type(); }
  }
}),{threshold:.3});
document.querySelectorAll('.fade').forEach(el=>io.observe(el));

function type(){
  const el = document.getElementById('typed'); let i = 0;
  (function step(){
    if(i < LETTER.length){
      el.innerHTML += LETTER[i] === '\n' ? '<br>' : LETTER[i];
      i++; setTimeout(step, 28);
    } else document.getElementById('cursor').style.display='none';
  })();
}

// Floating hearts background
const cv = document.getElementById('hearts'), cx = cv.getContext('2d');
let W, H, hs = [];
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();
const heart = (x,y,s,a)=>{
  cx.save(); cx.translate(x,y); cx.scale(s,s); cx.globalAlpha=a; cx.fillStyle='#ff4d85';
  cx.beginPath(); cx.moveTo(0,0.3);
  cx.bezierCurveTo(-1,-0.6,-2,0.5,0,1.8);
  cx.bezierCurveTo(2,0.5,1,-0.6,0,0.3);
  cx.fill(); cx.restore();
};
function spawn(x,y,burstMode){
  hs.push({x:x??Math.random()*W, y:y??H+20, s:burstMode?6+Math.random()*8:4+Math.random()*10,
    vy:burstMode?-(1+Math.random()*3):-(.3+Math.random()*.8), vx:(Math.random()-.5)*(burstMode?3:.6),
    a:burstMode?.9:.15+Math.random()*.25, life:burstMode?90:9999});
}
function burst(el){
  const r = el.getBoundingClientRect();
  for(let i=0;i<14;i++) spawn(r.left+r.width/2, r.top+r.height/2, true);
}
setInterval(()=>spawn(),600);
(function loop(){
  cx.clearRect(0,0,W,H);
  hs = hs.filter(h=>h.y>-30 && h.life>0);
  hs.forEach(h=>{ h.y+=h.vy; h.x+=h.vx+Math.sin(h.y/40)*.3; h.life--; heart(h.x,h.y,h.s,h.a*Math.min(1,h.life/30)); });
  requestAnimationFrame(loop);
})();

// Final surprise
document.getElementById('btn').onclick = e=>{
  const f = document.getElementById('final');
  f.textContent = FINAL_MSG; f.classList.add('show');
  for(let i=0;i<12;i++) setTimeout(()=>burst(e.target), i*120);
};
</script>
